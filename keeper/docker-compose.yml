version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: defi_recipes_postgres
    environment:
      POSTGRES_USER: recipes_admin
      POSTGRES_PASSWORD: recipes_password
      POSTGRES_DB: defi_recipes_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: defi_recipes_redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  postgres_data:
