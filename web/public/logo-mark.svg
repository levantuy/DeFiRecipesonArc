<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6FBFFF"/>
      <stop offset="100%" stop-color="#6FCF97"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6FBFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6FCF97" stop-opacity="0.25"/>
    </linearGradient>
  </defs>
  <!-- Arc path connecting 3 nodes — recipe flow through Arc network -->
  <!-- Node 1: source (left) -->
  <circle cx="7" cy="28" r="3.5" fill="url(#g1)"/>
  <!-- Node 2: middle transform -->
  <circle cx="20" cy="10" r="3.5" fill="url(#g1)"/>
  <!-- Node 3: destination (right) -->
  <circle cx="33" cy="28" r="3.5" fill="url(#g1)"/>
  <!-- Arc path: smooth curve through nodes — the "recipe" flow -->
  <path d="M7 28 Q10 10 20 10 Q30 10 33 28"
        stroke="url(#g1)"
        stroke-width="2.5"
        stroke-linecap="round"
        fill="none"/>
  <!-- Inner glow dots on arc midpoints — automated execution pulses -->
  <circle cx="13.5" cy="16" r="1.5" fill="url(#g1)" opacity="0.7"/>
  <circle cx="26.5" cy="16" r="1.5" fill="url(#g1)" opacity="0.7"/>
</svg>
