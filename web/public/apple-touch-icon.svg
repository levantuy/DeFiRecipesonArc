<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none">
  <defs>
    <linearGradient id="ag" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6FBFFF"/>
      <stop offset="100%" stop-color="#6FCF97"/>
    </linearGradient>
    <radialGradient id="aglow" cx="50%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#6FBFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6FBFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="180" height="180" rx="40" fill="#0d1b2f"/>
  <!-- Glow -->
  <ellipse cx="90" cy="115" rx="80" ry="55" fill="url(#aglow)"/>
  <!-- Nodes -->
  <circle cx="30" cy="130" r="16" fill="url(#ag)"/>
  <circle cx="90" cy="45" r="16" fill="url(#ag)"/>
  <circle cx="150" cy="130" r="16" fill="url(#ag)"/>
  <!-- Arc path -->
  <path d="M30 130 Q45 45 90 45 Q135 45 150 130"
        stroke="url(#ag)"
        stroke-width="11"
        stroke-linecap="round"
        fill="none"/>
  <!-- Pulse dots -->
  <circle cx="60" cy="73" r="7" fill="url(#ag)" opacity="0.72"/>
  <circle cx="120" cy="73" r="7" fill="url(#ag)" opacity="0.72"/>
</svg>
