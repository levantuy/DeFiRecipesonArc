<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <defs>
    <linearGradient id="gd1" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6FBFFF"/>
      <stop offset="100%" stop-color="#6FCF97"/>
    </linearGradient>
    <!-- Subtle glow background -->
    <radialGradient id="glow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#6FBFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#6FBFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Ambient glow -->
  <ellipse cx="20" cy="22" rx="18" ry="14" fill="url(#glow)"/>
  <!-- Node 1 -->
  <circle cx="7" cy="28" r="3.5" fill="url(#gd1)"/>
  <!-- Node 2 -->
  <circle cx="20" cy="10" r="3.5" fill="url(#gd1)"/>
  <!-- Node 3 -->
  <circle cx="33" cy="28" r="3.5" fill="url(#gd1)"/>
  <!-- Arc flow -->
  <path d="M7 28 Q10 10 20 10 Q30 10 33 28"
        stroke="url(#gd1)"
        stroke-width="2.5"
        stroke-linecap="round"
        fill="none"/>
  <!-- Pulse dots -->
  <circle cx="13.5" cy="16" r="1.5" fill="url(#gd1)" opacity="0.7"/>
  <circle cx="26.5" cy="16" r="1.5" fill="url(#gd1)" opacity="0.7"/>
</svg>
