name: DeFi Recipes CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-contracts:
    name: Foundry Smart Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Run Forge Tests
        run: |
          cd contracts
          forge test -vvv

  test-keeper:
    name: Keeper Build and Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: keeper/package-lock.json

      - name: Install Keeper Dependencies
        run: |
          cd keeper
          npm ci

      - name: Build Keeper
        run: |
          cd keeper
          npm run build

      - name: Test Keeper
        run: |
          cd keeper
          npm test

  test-web:
    name: Web Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Web Dependencies
        run: |
          cd web
          npm install

      - name: Build Web
        run: |
          cd web
          npm run build

  ci-gate:
    name: Monorepo Merge Gate
    runs-on: ubuntu-latest
    needs:
      - test-contracts
      - test-keeper
      - test-web
    if: always()
    steps:
      - name: Evaluate upstream jobs
        run: |
          echo "contracts=${{ needs.test-contracts.result }}"
          echo "keeper=${{ needs.test-keeper.result }}"
          echo "web=${{ needs.test-web.result }}"
          if [ "${{ needs.test-contracts.result }}" != "success" ] || [ "${{ needs.test-keeper.result }}" != "success" ] || [ "${{ needs.test-web.result }}" != "success" ]; then
            echo "One or more required checks failed."
            exit 1
          fi
